syntax = "proto3";

package journey;

// Optional display information. Preserve unknown fields and categories when
// importing, editing, or exporting a journey.
message JourneyMetadata {
  reserved 1;
  reserved "fields";

  oneof details {
    FlightMetadata flight = 2;
  }
}

message FlightMetadata {
  optional string flight_number = 1;
  optional string operating_airline_icao = 2;
  optional string aircraft_type_icao = 3;
  optional string registration = 4;
}

message Header {
  message Kind {
    enum BuiltIn {
      DEFAULT = 0;
      FLIGHT = 1;
    }

    oneof Kind {
      string custom_kind = 1;
      BuiltIn build_in = 2;
    }
  }

  enum Type {
    VECTOR = 0;
    BITMAP = 1;
  }

  string id = 1;
  string revision = 2;
  int32 journey_date__days_since_epoch = 10;
  int64 created_at__timestamp_sec = 3;
  optional int64 updated_at__timestamp_sec = 4;
  // TODO: consider add timezone for `start` and `end`.
  optional int64 start__timestamp_sec = 6;
  optional int64 end__timestamp_sec = 5;
  Type type = 7;
  Kind kind = 8;
  optional string note = 9;
  optional string postprocessor_algo = 11;
  // Whether this stored or exported journey includes a raw-data attachment.
  bool has_raw_data = 12;
  // Adding display information does not change the MLDX container version.
  JourneyMetadata metadata = 13;
}
