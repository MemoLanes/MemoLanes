[toolchain]
# native_toolchain_rust requires an exact channel version/date for reproducible builds.
channel = "1.97.1"
targets = [
  "aarch64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-apple-ios",
  "x86_64-linux-android",
]
