<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latency Test</title>
    <style>
      body {
        font-family: monospace;
        margin: 15px;
        font-size: 16px;
        line-height: 1.4;
        color: #f1f5ef;
        background: #0b100d;
      }
      button {
        margin: 8px 5px;
        padding: 12px 20px;
        font-size: 16px;
        min-height: 44px;
        color: #f1f5ef;
        border: 1px solid #2b3730;
        background: #1c2620;
        border-radius: 4px;
      }
      button:disabled {
        background: #151c18;
        color: #77837b;
      }
      select {
        color: #f1f5ef;
        background: #1c2620;
        border: 1px solid #2b3730;
      }
      #log {
        border: 1px solid #2b3730;
        padding: 15px;
        height: 60vh;
        overflow-y: auto;
        font-size: 14px;
        line-height: 1.3;
      }
      h3 {
        font-size: 20px;
        margin: 10px 0;
      }
      .status {
        padding: 10px;
        margin: 10px 0;
        border-radius: 4px;
        font-weight: bold;
      }
      .waiting {
        background: #352f19;
        border: 1px solid #8f7b32;
        color: #ffd75a;
      }
      .ready {
        background: #21331f;
        border: 1px solid #527b42;
        color: #b8ea72;
      }
      #browserCapabilities {
        color: #f1f5ef !important;
        background: #151c18 !important;
        border-color: #2b3730 !important;
      }
      #precisionTable tr,
      #precisionTable th,
      #precisionTable td {
        color: #f1f5ef !important;
        background: #151c18 !important;
        border-color: #2b3730 !important;
      }
      #precisionTable p {
        color: #a2ada6 !important;
      }
      html[data-theme="light"] body {
        color: #182016;
        background: #fafbf5;
      }
      html[data-theme="light"] button,
      html[data-theme="light"] select {
        color: #182016;
        background: #f0f0f0;
        border-color: #ccc;
      }
      html[data-theme="light"] button:disabled {
        color: #999;
        background: #ddd;
      }
      html[data-theme="light"] #log {
        border-color: #ccc;
      }
      html[data-theme="light"] .waiting {
        color: #856404;
        background: #fff3cd;
        border-color: #ffeaa7;
      }
      html[data-theme="light"] .ready {
        color: #155724;
        background: #d4edda;
        border-color: #c3e6cb;
      }
      html[data-theme="light"] #browserCapabilities,
      html[data-theme="light"] #precisionTable tr,
      html[data-theme="light"] #precisionTable th,
      html[data-theme="light"] #precisionTable td {
        color: #182016 !important;
        background: #f8f9fa !important;
        border-color: #dee2e6 !important;
      }
      html[data-theme="light"] #precisionTable p {
        color: #666 !important;
      }
    </style>
  </head>
  <body>
    <h3>Render Diagnostics</h3>

    <div
      id="browserCapabilities"
      style="
        margin: 10px 0;
        padding: 10px;
        background: #151c18;
        border: 1px solid #2b3730;
        border-radius: 4px;
      "
    >
      <h4 style="margin: 5px 0 10px 0">Browser Capabilities</h4>
      <div id="capabilitiesInfo" style="font-size: 14px; line-height: 1.6">
        Detecting...
      </div>
      <div id="precisionTable" style="margin-top: 10px"></div>
    </div>

    <div id="status" class="status waiting">
      Waiting for API endpoint from Flutter...
    </div>

    <div style="margin: 10px 0">
      <label for="sizeSelect">File Size: </label>
      <select id="sizeSelect">
        <option value="1024">1 KB</option>
        <option value="10240">10 KB</option>
        <option value="102400">100 KB</option>
        <option value="1048576" selected>1 MB</option>
        <option value="5242880">5 MB</option>
        <option value="10485760">10 MB</option>
      </select>
    </div>

    <button id="startBtn" onclick="startTest()" disabled>Start</button>
    <button id="stopBtn" onclick="stopTest()" disabled>Stop</button>
    <button onclick="clearLog()">Clear</button>

    <div id="log"></div>
  </body>
</html>
