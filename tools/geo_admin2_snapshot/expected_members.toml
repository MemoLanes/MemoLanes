# CHN admin-2 membership gate and reviewed names for
# tools/geo_admin2_snapshot/snapshot.py.
#
# 364 members: the 333 GB/T 2260 prefecture-level (地级) divisions minus
# 460300 三沙市 (excluded: absent from Overture's CN division data
# entirely, checked across all subtypes), plus the 32 省直辖县级
# county-level divisions administered directly by their province (Hainan
# 4690xx, Hubei 4290xx, Henan 419001, Xinjiang 6590xx).
#
# `adcode` is the 4-digit GB/T 2260 prefix for a prefecture-level row (e.g.
# "4403" for Shenzhen, adcode 440300) or the full 6-digit adcode for a
# 省直辖县级 row (e.g. "469002" for Qionghai). `name_zh` is this snapshot's
# canonical Chinese name and also the join key against the Overture
# `division.names.common['zh']` value; snapshot.py resolves every row here
# to exactly one Overture division by exact name match, or by an explicit
# `gers_id` pin when the name match is ambiguous or absent (none needed as
# of the 2026-10-21.0 release).
#
# `name_en` is the shipped English name, taken from the unit's English
# Wikipedia article (via `wikidata`) and normalized to one style: cities bare
# ("Lanzhou"), with "City" kept only where the bare name repeats its province
# ("Jilin City"); 地区 "X Prefecture"; 盟 "X League"; 自治州 and 自治县 in
# full with the ethnic groups; 县 "X County"; 林区 "X Forestry District".
# Wikipedia's own disambiguators (", Tibet", "Ordos City" vs the desert) are
# dropped — they separate things outside this tree.
#
# Source: MCA administrative division data via DataV.GeoAtlas
# (https://datav.aliyun.com/portal/school/atlas/area_selector), snapshotted
# 2026-08-19, plus 659011 新星市 and 659012 白杨市 (founded 2021 and 2023).
# Reviewed by eye against MCA's 2023 行政区划代码.
